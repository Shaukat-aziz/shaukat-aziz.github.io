<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DJVU Viewer — Shaukat Aziz</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <style>
    html,body{height:100%;margin:0}
    #viewer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0a0a1a;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .fallback{padding:1.5em;background:#121236;border:1px solid rgba(139,0,255,0.4);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.35);text-align:center}
    a{color:#c084fc}
  </style>
</head>
<body>
  <div id="viewer">
    <div class="fallback">
      <div id="status">Initializing DJVU viewer...</div>
      <div id="download" style="margin-top:0.75em"></div>
    </div>
  </div>

  <script src="https://unpkg.com/djvujs@latest/build/djvu.min.js"></script>
  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const rawFile = params.get('file');
      const status = document.getElementById('status');
      const download = document.getElementById('download');

      function sanitizeFileUrl(input) {
        if (!input) return null;
        try {
          const parsed = new URL(input, window.location.origin);
          if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
            return parsed.href;
          }
        } catch (_) {}
        return null;
      }

      const safeFile = sanitizeFileUrl(rawFile);
      if (!safeFile) {
        status.textContent = rawFile ? 'Invalid or unsupported file URL.' : 'No file provided.';
        return;
      }

      const anchor = document.createElement('a');
      anchor.href = safeFile;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';
      anchor.textContent = 'Download DJVU';
      download.appendChild(anchor);

      function tryInit() {
        try {
          if (window.DJVU || window.DjVu || window.djvujs) {
            status.textContent = 'djvu library found — rendering...';
            const iframe = document.createElement('iframe');
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.src = 'about:blank';
            document.getElementById('viewer').innerHTML = '';
            document.getElementById('viewer').appendChild(iframe);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(
              '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
              '<style>html,body{height:100%;margin:0}#root{width:100%;height:100%}</style></head>' +
              '<body><div id="root">Loading...</div>' +
              '<script src="https://unpkg.com/djvujs@latest/build/djvu.min.js"><\/script>' +
              '<script>const fileUrl=' + JSON.stringify(safeFile) + ';try{if(window.DjVuViewer){new DjVuViewer({container:document.getElementById("root"),file:fileUrl});}else if(window.DJVU){document.getElementById("root").innerText="DJVU library loaded but automatic viewer init is not implemented for this build.";}else{document.getElementById("root").innerText="DJVU library not available in iframe.";}}catch(e){document.getElementById("root").innerText="Error rendering DJVU: "+e.message;}<\/script></body></html>'
            );
            doc.close();
            return true;
          }
        } catch (err) {
          console.warn('djvu init error', err);
        }
        return false;
      }

      let attempts = 0;
      const iv = setInterval(() => {
        attempts++;
        if (tryInit() || attempts > 6) {
          clearInterval(iv);
          if (attempts > 6) status.textContent = 'Could not auto-render DJVU — use the download link below.';
        }
      }, 500);
    })();
  </script>
</body>
</html>
