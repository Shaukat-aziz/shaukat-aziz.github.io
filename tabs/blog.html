<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('site-theme') || 'default';
            if (savedTheme !== 'default') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
    <link rel="stylesheet" href="../css/style.css?v=1.0.1">
</head>
<body>
    <div id="navbar"></div>
    <section class="section">
        <div class="section-container">
            <h2>Latest Blog Posts</h2>
            <div class="blog-posts">
                <iframe src="https://qphysix.blogspot.com/2025/06/quantum-computing.html" width="100%" height="600" style="border:none;overflow:auto;" title="Quantum Computing Blog"></iframe>
            </div>
        </div>
    </section>
    <script src="nav.js"></script>
</body>
</html>
