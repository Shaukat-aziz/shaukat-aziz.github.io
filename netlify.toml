"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "python3 optimize.py"
  publish = "dist"

[[redirects]]
  from = "https://www.shaukataziz.vip/*"
  to = "https://shaukataziz.vip/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.shaukataziz.vip/*"
  to = "https://shaukataziz.vip/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/notes"
  to = "/tabs/notes.html"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/tabs/projects.html"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/tabs/blog.html"
  status = 301

[[redirects]]
  from = "/favorites"
  to = "/tabs/favorites.html"
  status = 301

[[redirects]]
  from = "/favorite"
  to = "/tabs/favorites.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/small_files/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/tabs/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
